<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 832" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0510"/>
      <stop offset="0.55" stop-color="#120a18"/>
      <stop offset="1" stop-color="#160b1c"/>
    </linearGradient>
    <pattern id="winB" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="9" fill="#9BB5C9" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="832" fill="url(#skyB)"/>

  <!-- faint moon -->
  <circle cx="1060" cy="150" r="46" fill="#c9c2d4" opacity="0.06"/>

  <!-- dim scattered leads -->
  <g fill="#9BB5C9" opacity="0.14">
    <circle cx="120" cy="140" r="3"/><circle cx="260" cy="90" r="2.5"/><circle cx="400" cy="200" r="3"/>
    <circle cx="520" cy="120" r="2.5"/><circle cx="640" cy="260" r="3"/><circle cx="760" cy="150" r="2.5"/>
    <circle cx="880" cy="220" r="3"/><circle cx="1000" cy="110" r="2.5"/><circle cx="1140" cy="190" r="3"/>
    <circle cx="200" cy="320" r="2.5"/><circle cx="340" cy="380" r="3"/><circle cx="560" cy="340" r="2.5"/>
    <circle cx="720" cy="400" r="3"/><circle cx="900" cy="360" r="2.5"/><circle cx="1060" cy="320" r="3"/>
    <circle cx="1180" cy="300" r="2.5"/>
  </g>

  <!-- skyline (dim) -->
  <g>
    <g fill="#140a1c">
      <rect x="0" y="612" width="90" height="220"/>
      <rect x="90" y="682" width="60" height="150"/>
      <rect x="150" y="532" width="110" height="300"/>
      <rect x="260" y="652" width="70" height="180"/>
      <rect x="330" y="592" width="130" height="240"/>
      <rect x="460" y="492" width="80" height="340"/>
      <rect x="540" y="632" width="100" height="200"/>
      <rect x="640" y="552" width="70" height="280"/>
      <rect x="710" y="612" width="120" height="220"/>
      <rect x="830" y="512" width="80" height="320"/>
      <rect x="910" y="642" width="110" height="190"/>
      <rect x="1020" y="572" width="70" height="260"/>
      <rect x="1090" y="622" width="120" height="210"/>
      <rect x="1210" y="652" width="70" height="180"/>
    </g>
    <!-- dim windows overlay -->
    <g>
      <rect x="0" y="612" width="90" height="220" fill="url(#winB)"/>
      <rect x="150" y="532" width="110" height="300" fill="url(#winB)"/>
      <rect x="330" y="592" width="130" height="240" fill="url(#winB)"/>
      <rect x="460" y="492" width="80" height="340" fill="url(#winB)"/>
      <rect x="640" y="552" width="70" height="280" fill="url(#winB)"/>
      <rect x="710" y="612" width="120" height="220" fill="url(#winB)"/>
      <rect x="830" y="512" width="80" height="320" fill="url(#winB)"/>
      <rect x="1020" y="572" width="70" height="260" fill="url(#winB)"/>
      <rect x="1090" y="622" width="120" height="210" fill="url(#winB)"/>
    </g>
  </g>

  <!-- ground haze -->
  <rect x="0" y="792" width="1280" height="40" fill="#0a0510" opacity="0.6"/>
</svg>
