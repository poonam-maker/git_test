<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 832" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241026"/>
      <stop offset="0.5" stop-color="#3d2535"/>
      <stop offset="1" stop-color="#2a1520"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#E8A020" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#9D7088" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="winR" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="9" fill="#F5C55A" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="832" fill="url(#skyR)"/>
  <rect width="1280" height="832" fill="url(#glowR)"/>

  <!-- bright moon -->
  <circle cx="1060" cy="150" r="46" fill="#F5E6C8" opacity="0.9"/>
  <circle cx="1060" cy="150" r="70" fill="#F5E6C8" opacity="0.12" filter="url(#soft)"/>

  <!-- glowing lead network -->
  <g stroke="#9BB5C9" stroke-width="1" opacity="0.35">
    <line x1="120" y1="140" x2="260" y2="90"/>
    <line x1="260" y1="90" x2="400" y2="200"/>
    <line x1="400" y1="200" x2="520" y2="120"/>
    <line x1="520" y1="120" x2="640" y2="260"/>
    <line x1="640" y1="260" x2="760" y2="150"/>
    <line x1="760" y1="150" x2="880" y2="220"/>
    <line x1="880" y1="220" x2="1000" y2="110"/>
    <line x1="1000" y1="110" x2="1140" y2="190"/>
    <line x1="200" y1="320" x2="340" y2="380"/>
    <line x1="340" y1="380" x2="560" y2="340"/>
    <line x1="560" y1="340" x2="720" y2="400"/>
    <line x1="720" y1="400" x2="900" y2="360"/>
    <line x1="900" y1="360" x2="1060" y2="320"/>
  </g>
  <!-- glow halos -->
  <g fill="#E8A020" opacity="0.5" filter="url(#soft)">
    <circle cx="120" cy="140" r="8"/><circle cx="400" cy="200" r="8"/><circle cx="640" cy="260" r="8"/>
    <circle cx="880" cy="220" r="8"/><circle cx="1140" cy="190" r="8"/><circle cx="340" cy="380" r="8"/>
    <circle cx="720" cy="400" r="8"/><circle cx="1060" cy="320" r="8"/>
  </g>
  <!-- bright lead nodes -->
  <g fill="#F5C55A">
    <circle cx="120" cy="140" r="3.5"/><circle cx="260" cy="90" r="3"/><circle cx="400" cy="200" r="3.5"/>
    <circle cx="520" cy="120" r="3"/><circle cx="640" cy="260" r="3.5"/><circle cx="760" cy="150" r="3"/>
    <circle cx="880" cy="220" r="3.5"/><circle cx="1000" cy="110" r="3"/><circle cx="1140" cy="190" r="3.5"/>
    <circle cx="200" cy="320" r="3"/><circle cx="340" cy="380" r="3.5"/><circle cx="560" cy="340" r="3"/>
    <circle cx="720" cy="400" r="3.5"/><circle cx="900" cy="360" r="3"/><circle cx="1060" cy="320" r="3.5"/>
    <circle cx="1180" cy="300" r="3"/>
  </g>

  <!-- skyline (lit) -->
  <g>
    <g fill="#1c1024">
      <rect x="0" y="612" width="90" height="220"/>
      <rect x="90" y="682" width="60" height="150"/>
      <rect x="150" y="532" width="110" height="300"/>
      <rect x="260" y="652" width="70" height="180"/>
      <rect x="330" y="592" width="130" height="240"/>
      <rect x="460" y="492" width="80" height="340"/>
      <rect x="540" y="632" width="100" height="200"/>
      <rect x="640" y="552" width="70" height="280"/>
      <rect x="710" y="612" width="120" height="220"/>
      <rect x="830" y="512" width="80" height="320"/>
      <rect x="910" y="642" width="110" height="190"/>
      <rect x="1020" y="572" width="70" height="260"/>
      <rect x="1090" y="622" width="120" height="210"/>
      <rect x="1210" y="652" width="70" height="180"/>
    </g>
    <g>
      <rect x="0" y="612" width="90" height="220" fill="url(#winR)"/>
      <rect x="90" y="682" width="60" height="150" fill="url(#winR)"/>
      <rect x="150" y="532" width="110" height="300" fill="url(#winR)"/>
      <rect x="260" y="652" width="70" height="180" fill="url(#winR)"/>
      <rect x="330" y="592" width="130" height="240" fill="url(#winR)"/>
      <rect x="460" y="492" width="80" height="340" fill="url(#winR)"/>
      <rect x="540" y="632" width="100" height="200" fill="url(#winR)"/>
      <rect x="640" y="552" width="70" height="280" fill="url(#winR)"/>
      <rect x="710" y="612" width="120" height="220" fill="url(#winR)"/>
      <rect x="830" y="512" width="80" height="320" fill="url(#winR)"/>
      <rect x="910" y="642" width="110" height="190" fill="url(#winR)"/>
      <rect x="1020" y="572" width="70" height="260" fill="url(#winR)"/>
      <rect x="1090" y="622" width="120" height="210" fill="url(#winR)"/>
      <rect x="1210" y="652" width="70" height="180" fill="url(#winR)"/>
    </g>
  </g>

  <!-- warm ground glow -->
  <rect x="0" y="770" width="1280" height="62" fill="#E8A020" opacity="0.08"/>
</svg>
